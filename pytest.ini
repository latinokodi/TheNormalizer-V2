[pytest]
testpaths = backend/tests

# Everything in the suite is arithmetic, argument lists and a test client. One area is not, and it is
# marked so the exception is visible in the report rather than hidden in a helper: `process.py` is
# tested against the interpreter that is already running the tests -- never ffmpeg -- because it is the
# module that spawns, and `/api/health` asks ffmpeg its version.
markers =
    real_process: starts a real child process. Never ffmpeg, except `/api/health`.

# pytest-bdd 8 registers its step fixtures the old way and warns once per scenario. The warning is
# about a pytest 10 removal inside pytest-bdd's own code, not in this project, and thirty copies of it
# on every run is noise that hides the warnings that do matter. Suppressed by message rather than by
# category, so a deprecation of ours still shows up.
filterwarnings =
    ignore:Passing nodeid to _register_fixture is deprecated
    ignore:Passing baseid to FixtureDef is deprecated
